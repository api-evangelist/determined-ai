openapi: 3.0.3
info:
  title: Determined AI REST Authentication Tokens API
  description: 'Determined is an open-source deep learning platform that helps teams train

    models faster, share GPU resources, and collaborate. The REST API exposes

    cluster, experiment, model, checkpoint, template, user, and token

    management capabilities used by the CLI and Web UI.

    '
  version: latest
  contact:
    name: Determined AI
    url: https://www.determined.ai/
  license:
    name: Apache-2.0
    url: https://github.com/determined-ai/determined/blob/main/LICENSE
servers:
- url: https://master.example.com
  description: Determined master server (cluster-specific)
security:
- bearerAuth: []
tags:
- name: Tokens
  description: Manage tokens
paths:
  /api/v1/tokens:
    get:
      tags:
      - Tokens
      summary: List tokens
      operationId: getAccessTokens
      responses:
        '200':
          description: List of access tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokenInfo:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessToken'
components:
  schemas:
    AccessToken:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        expiry:
          type: string
          format: date-time
        revoked:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token issued by the /auth/login endpoint.
